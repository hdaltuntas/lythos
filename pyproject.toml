[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lythosfea"
version = "0.1.0"
description = "2D finite element analysis for geotechnical engineering: slopes, embankments and deep excavations, with factors of safety by strength reduction and internal forces in piles and walls."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hasan Deniz Altuntaş", email = "lythosfea@gmail.com" }]
keywords = [
    "geotechnical", "finite element", "fem", "slope stability",
    "factor of safety", "strength reduction", "excavation", "retaining wall",
    "pile", "mohr-coulomb", "soil mechanics", "civil engineering", "dxf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
# NumPy, SciPy and Matplotlib are all required rather than optional: this is a
# program whose output is drawings - contours, deformed meshes, section force
# diagrams - and a build without them could not produce any of it.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Binary DXF, splines and block references; ASCII DXF needs nothing extra.
dxf = ["ezdxf>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/hdaltuntas/lythos"
Repository = "https://github.com/hdaltuntas/lythos"
Documentation = "https://github.com/hdaltuntas/lythos/blob/main/docs/theory.md"
Validation = "https://github.com/hdaltuntas/lythos/blob/main/docs/validation.md"
Issues = "https://github.com/hdaltuntas/lythos/issues"

[project.scripts]
lythos = "lythos.cli:main"

[tool.setuptools.packages.find]
include = ["lythos*"]

[tool.setuptools.package-data]
"lythos.gui" = ["static/*"]
"lythos.data" = ["*.dxf"]

[tool.pytest.ini_options]
markers = ["slow: analyses that take more than a few seconds"]
testpaths = ["tests"]
